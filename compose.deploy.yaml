x-service: &service
  restart: unless-stopped
  logging:
    driver: "none"

services:
  db:
    <<: *service
    ports: !reset []

  migrate:
    image: postgres:17
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    volumes:
      - ./db:/db:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-ec", "exec psql -X -v ON_ERROR_STOP=1 \"$$DATABASE_URL\" -f /db/migrate.sql"]

  api:
    <<: *service
    ports: !reset []
    environment:
      MINI_APP_URL: ${MINI_APP_URL:?set the HTTPS Mini App URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set the Telegram bot token}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?set the Telegram webhook secret}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 6

  worker:
    <<: *service
    depends_on:
      migrate:
        condition: service_completed_successfully

  proxy:
    <<: *service
    image: caddy:2-alpine
    environment:
      BILET_DOMAIN: ${BILET_DOMAIN:?set the public DNS name}
    ports:
      - "${BILET_BIND_ADDR:-0.0.0.0}:${BILET_HTTP_PORT:-80}:80"
      - "${BILET_BIND_ADDR:-0.0.0.0}:${BILET_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
