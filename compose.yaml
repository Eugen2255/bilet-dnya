services:
  api:
    image: bilet-dnya:local
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?copy .env.example to .env}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      IMPORT_STORAGE: /srv/bilet/uploads
    volumes:
      - import_uploads:/srv/bilet/uploads
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: bilet-dnya:local
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?copy .env.example to .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      MODEL_PRIMARY_URL: ${MODEL_PRIMARY_URL:-}
      MODEL_PRIMARY_ID: ${MODEL_PRIMARY_ID:-}
      MODEL_PRIMARY_API_KEY: ${MODEL_PRIMARY_API_KEY:-}
      MODEL_FALLBACK_URL: ${MODEL_FALLBACK_URL:-}
      MODEL_FALLBACK_ID: ${MODEL_FALLBACK_ID:-}
      MODEL_FALLBACK_API_KEY: ${MODEL_FALLBACK_API_KEY:-}
      IMPORT_STORAGE: /srv/bilet/uploads
    volumes:
      - import_uploads:/srv/bilet/uploads
    stop_grace_period: 45s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  import_uploads:
